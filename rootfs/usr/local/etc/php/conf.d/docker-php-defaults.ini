; Defaults of this image, on top of php.ini-production. PHP_INI_* variables
; override them at container start.

; msmtp reads /etc/msmtprc, generated from MSMTP_* or mounted.
sendmail_path = "/usr/bin/msmtp -t"

; php.ini-production leaves it On: the X-Powered-By header gives away the exact PHP version.
expose_php = Off
