name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: republishes only the images whose Debian base image moved, which
    # is how a Debian update reaches the tags. Must match DAILY_CRON below.
    # Fixes to PHP itself arrive through versions.json, hence a release.
    - cron: '17 3 * * *'
    # Weekly: republishes everything, for what the base digest does not show:
    # Composer, install-php-extensions, PECL releases.
    - cron: '43 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to publish, without the leading v (empty: the latest release)'
        required: false
        type: string
      force:
        description: 'Rebuild every image, even those whose base image did not change'
        required: false
        type: boolean
        default: true
  # Called by release.yml once semantic-release has pushed the tag: a tag
  # created with GITHUB_TOKEN does not start a workflow run of its own, hence
  # no `tags: ['v*']` trigger above.
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || 'frugan/php-legacy' }}
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/php-legacy
  # The PHP branches are the keys of versions.json.
  DEBIAN_CODENAME: bookworm
  DAILY_CRON: '17 3 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v7

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Lint the shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x \
            rootfs/usr/local/bin/* \
            rootfs/usr/local/lib/docker-php/*.sh \
            rootfs/usr/local/lib/docker-php/init.d/*.sh \
            build/build-php.sh \
            build/compat/* \
            .github/scripts/*.sh \
            tests/smoke.sh

  plan:
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      rolling: ${{ steps.plan.outputs.rolling }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      merge: ${{ steps.plan.outputs.merge }}
    steps:
      # Full history for the tags: scheduled runs rebuild the latest release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        run: .github/scripts/plan.sh
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}

  # One job per PHP branch, variant and architecture, each on a native runner:
  # compiling PHP and the extensions under QEMU would take hours.
  # Both targets of a variant are built in the same job, the dev one on top of
  # the cache of the other.
  build:
    name: build ${{ matrix.php }}-${{ matrix.variant }} (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    env:
      CACHE_SCOPE: ${{ matrix.php }}-${{ matrix.variant }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Labels
        id: labels
        run: |
          {
            echo 'list<<EOF'
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "org.opencontainers.image.revision=$(git rev-parse HEAD)"
            if version="$(git describe --tags --exact-match 2>/dev/null)"; then
              echo "org.opencontainers.image.version=${version#v}"
            fi
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Build ${{ matrix.variant }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_VARIANT=${{ matrix.variant }}
            BASE_IMAGE=${{ matrix.base }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.labels.outputs.list }}
          load: true
          tags: smoke:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Smoke test ${{ matrix.variant }}
        run: tests/smoke.sh smoke:${{ matrix.variant }} ${{ matrix.variant }}

      - name: Build ${{ matrix.variant }}-dev
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}-dev
          platforms: linux/${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_VARIANT=${{ matrix.variant }}
            BASE_IMAGE=${{ matrix.base }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.labels.outputs.list }}
          load: true
          tags: smoke:${{ matrix.variant }}-dev
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Smoke test ${{ matrix.variant }}-dev
        run: tests/smoke.sh smoke:${{ matrix.variant }}-dev ${{ matrix.variant }}-dev

      - name: Log in to Docker Hub
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: the publish job below tags the two platforms
      # together. Everything comes from the cache filled by the builds above.
      - name: Push ${{ matrix.variant }}
        id: push
        if: needs.plan.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_VARIANT=${{ matrix.variant }}
            BASE_IMAGE=${{ matrix.base }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.labels.outputs.list }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          sbom: true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      - name: Push ${{ matrix.variant }}-dev
        id: push-dev
        if: needs.plan.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.variant }}-dev
          platforms: linux/${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_VARIANT=${{ matrix.variant }}
            BASE_IMAGE=${{ matrix.base }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.labels.outputs.list }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          sbom: true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      - name: Export the digests
        if: needs.plan.outputs.publish == 'true'
        run: |
          mkdir -p "digests/${VARIANT}" "digests/${VARIANT}-dev"
          touch "digests/${VARIANT}/${DIGEST#sha256:}" "digests/${VARIANT}-dev/${DIGEST_DEV#sha256:}"
          docker run --rm --entrypoint php "smoke:${VARIANT}" -r 'echo PHP_VERSION;' >digests/php-version
        env:
          VARIANT: ${{ matrix.variant }}
          DIGEST: ${{ steps.push.outputs.digest }}
          DIGEST_DEV: ${{ steps.push-dev.outputs.digest }}

      - name: Upload the digests
        if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.php }}-${{ matrix.variant }}-${{ matrix.platform }}
          path: digests
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.php }}-${{ matrix.variant }}
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.merge != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.merge) }}
    # A release and a scheduled rebuild finishing together must not interleave
    # their tags.
    concurrency:
      group: publish-${{ matrix.php }}-${{ matrix.variant }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.php }}-${{ matrix.variant }}-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform images
        run: .github/scripts/publish.sh
        env:
          PHP_MINOR: ${{ matrix.php }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.plan.outputs.version }}
          ROLLING: ${{ needs.plan.outputs.rolling }}

  description:
    needs: [plan, publish]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.rolling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "EOL PHP 5.6-8.1 patched against php2shell: Composer, WP-CLI, msmtp, Supercronic, env extensions"
          readme-filepath: ./README.md
